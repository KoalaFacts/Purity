name: Solid v2 rc.18 comparator lock verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/solid-v2/app-fixture/**'
      - '.github/workflows/solid-v2-rc18-lock.yml'

permissions:
  contents: write

jobs:
  isolated-lock:
    name: Resolve rc.18 and archive complete lock
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/sv2-001-rc18-isolated-app-lock' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Resolve isolated comparator lock (no lifecycle scripts)
        working-directory: benchmark/solid-v2/app-fixture
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Reinstall exact resolved dependency tree
        working-directory: benchmark/solid-v2/app-fixture
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual package integrities and client entry resolution
        working-directory: benchmark/solid-v2/app-fixture
        env:
          NODE_ENV: production
          NODE_OPTIONS: ''
        run: node --experimental-strip-types verify-target-lock.ts
      - name: Archive candidate lock and identity report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solid-v2-rc18-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/solid-v2/app-fixture/package-lock.json
            benchmark/solid-v2/app-fixture/validation-report.json
          if-no-files-found: error
      - name: Install pinned repository formatter for canonical source
        run: npm ci
      - name: Format fixture source with repo Oxfmt
        run: npx vp fmt benchmark/solid-v2/app-fixture/package.json benchmark/solid-v2/app-fixture/verify-target-lock.ts
      - name: Commit generated transitive lock and canonical source to this PR only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark/solid-v2/app-fixture/package-lock.json benchmark/solid-v2/app-fixture/package.json benchmark/solid-v2/app-fixture/verify-target-lock.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore(sv2-001): freeze generated rc.18 lock and Oxfmt source'
            git push origin HEAD:refs/heads/evidence/sv2-001-rc18-isolated-app-lock
          fi
