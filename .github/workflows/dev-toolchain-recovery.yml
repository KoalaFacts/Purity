name: Development toolchain recovery

on:
  push:
    branches: [refactor/sv2-012-client-first-aot]
    paths: [.github/workflows/dev-toolchain-recovery.yml]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Package public source and pinned development tools without credentials
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/purity-dev"
          mkdir -p "$out"
          git bundle create "$out/source.bundle" HEAD
          tar -C "$(dirname "$(dirname "$(command -v node)")")" -czf "$out/node24.tar.gz" bin lib include share
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf "$out/dependencies.tar.gz"
          node --version > "$out/versions.txt"
          npm --version >> "$out/versions.txt"
          git rev-parse HEAD >> "$out/versions.txt"
          sha256sum "$out"/*.gz "$out/source.bundle" > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: purity-offline-node24-toolchain
          path: ${{ runner.temp }}/purity-dev/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
