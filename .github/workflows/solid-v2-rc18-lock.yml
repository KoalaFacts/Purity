name: Solid v2 rc.18 comparator lock verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/solid-v2/app-fixture/**'
      - '.github/workflows/solid-v2-rc18-lock.yml'

permissions:
  contents: read

jobs:
  isolated-lock:
    name: Resolve rc.18 and archive complete lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Resolve isolated comparator lock (no lifecycle scripts)
        working-directory: benchmark/solid-v2/app-fixture
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reinstall exact resolved dependency tree
        working-directory: benchmark/solid-v2/app-fixture
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual package integrities and client entry resolution
        working-directory: benchmark/solid-v2/app-fixture
        env:
          NODE_ENV: production
          NODE_OPTIONS: ''
        run: node --experimental-strip-types verify-target-lock.ts
      - name: Archive candidate lock and identity report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solid-v2-rc18-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/solid-v2/app-fixture/package-lock.json
            benchmark/solid-v2/app-fixture/validation-report.json
          if-no-files-found: error
