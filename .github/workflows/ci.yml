name: CI — Lint, Test, Build

# Runs automatically on every push to main and every PR.
# Verifies code quality, type safety, tests, and build integrity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint → Test → Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install root dependencies
        # Installs all workspace dependencies from lockfile
        run: npm ci

      - name: 🔐 Audit all dependencies
        # Include example build and deployment tools so vulnerable pinned
        # transitives cannot pass CI while blocking Dependabot updates.
        run: npm audit --audit-level=low

      - name: 🔐 Verify package provenance (non-blocking)
        # npm attestation API can be flaky; log results but don't gate CI
        run: npm audit signatures || true

      - name: 🔍 Format check (Oxfmt — Vite+)
        # Verifies all files are formatted; no modifications
        run: npm run format:check

      - name: 🔍 Lint (Oxlint — Vite+)
        # Uses the root Vite+ lint configuration.
        run: npm run lint

      - name: 🔷 Type check @purityjs/core
        # Verifies TypeScript types compile without errors
        run: cd packages/core && npx tsc --noEmit

      - name: 🧪 Test workspaces
        # Runs every workspace test script, including SSR parity tests.
        run: npm test

      - name: 🏗️ Build @purityjs/core
        # Produces dist/ with ESM, CJS, and .d.ts type declarations
        run: npm run build -w packages/core

      - name: 🧠 Check inspector registry retention and leak detection
        run: node --experimental-strip-types packages/core/tests/inspect-retention.ts

      - name: 🏗️ Build @purityjs/vite-plugin
        # Produces dist/ with the compiled plugin
        run: npm run build -w packages/vite-plugin

      - name: Measure production JavaScript bundle sizes
        id: bundle_size
        run: node --experimental-strip-types benchmark/bundle-size/measure.ts

      - name: Save bundle size evidence
        if: ${{ !cancelled() && steps.bundle_size.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purity-bundle-sizes-main-${{ github.run_attempt }}
          path: benchmark/dist/bundle-size/report.*
          if-no-files-found: error

      - name: 🏗️ Build Vercel Edge example
        run: npm run build -w examples/ssr-stream-vercel-edge

      - name: 🏗️ Build benchmark (verifies AOT compilation)
        # Runs the workspace Vite+ build — proves the AOT plugin compiles html`` templates.
        # Benchmark is a workspace member so deps are already installed.
        run: npm run build -w benchmark

      - name: 🏗️ Build dashboard demo (smoke check)
        # Builds the live demo so regressions in examples/dashboard don't
        # land on main and surface only at next benchmark deploy.
        run: npm run build -w examples/dashboard

      - name: 📚 Build documentation site
        run: npm run build -w examples/docs-site

  browser-islands:
    name: Islands first interaction (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🌐 Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 🧪 Check first island interactions
        run: npm run test:browser:islands

      - name: 🧪 Check DevTools panel and production exclusion
        run: npm run test:browser:devtools -w @purityjs/vite-plugin

      - name: Verify measured production counters
        id: bundle_size
        run: node --experimental-strip-types benchmark/bundle-size/measure.ts --verify

      - name: Save verified bundle size evidence
        if: ${{ !cancelled() && steps.bundle_size.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purity-bundle-sizes-browser-${{ github.run_attempt }}
          path: benchmark/dist/bundle-size/report.*
          if-no-files-found: error

      - name: 🧪 Check visible-list rendering
        run: npm run test:browser:virtual

      - name: 🧠 Check memory retention
        run: npm run test:browser:memory

      - name: 🧠 Check SSR boundary memory retention
        run: npm run test:ssr:memory

      - name: 🧪 Check published CLI projects
        run: npm run test:published-cli

      - name: 🧪 Check packaged SSR node retention
        run: npm run test:browser:ssr-retention

      - name: 🧪 Check app forms and server actions
        run: npm run test:browser:app-actions
