name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version matching the selected checkout and all eight packages (e.g. 0.4.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Verify requested version
        run: |
          for package_dir in . packages/signals packages/compiler packages/core packages/router packages/platform packages/ssr packages/vite-plugin packages/cli; do
            package_version="$(node -p "require('./${package_dir}/package.json').version")"
            if [ "$package_version" != "$RELEASE_VERSION" ]; then
              echo "Version mismatch in $package_dir: $package_version != $RELEASE_VERSION" >&2
              exit 1
            fi
          done

      # Full CI checks before publish
      - name: Format check (Oxfmt — Vite+)
        run: npm run format:check

      - name: Lint (Oxlint — Vite+)
        run: npm run lint

      # Build dependencies first: declarations and runtime exports are consumed
      # by other packages during their build and tests.
      - name: Build framework packages in dependency order
        run: |
          npm run build -w packages/signals
          npm run build -w packages/compiler
          npm run build -w packages/core
          npm run build -w packages/router
          npm run build -w packages/platform
          npm run build -w packages/ssr
          npm run build -w packages/vite-plugin
          npm run build -w packages/cli

      - name: Type-check core
        run: npx tsc --noEmit -p packages/core

      - name: Test all workspaces
        run: |
          npm test
          node --test scripts/finalize-release.test.mjs

      - name: Verify license texts in all npm tarballs
        run: npm run check:licenses

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check packaged client and SSR projects
        run: npm run test:browser:ssr-retention

      - name: Check rendering security
        run: npm run test:browser:security

      - name: Check Node request and public file boundaries
        run: npm run test:security:requests

      # Each package trusts this workflow and its production environment.
      - name: Publish packages in dependency order
        run: |
          for package in signals compiler core router platform ssr vite-plugin cli; do
            if npm view "@purityjs/$package@$RELEASE_VERSION" version --prefer-online >/dev/null 2>&1; then
              echo "@purityjs/$package@$RELEASE_VERSION is already published"
            else
              npm publish -w "packages/$package"
            fi
          done

      - name: Wait for published packages in npm registry
        run: |
          deadline=$((SECONDS + 600))
          for package in @purityjs/signals @purityjs/compiler @purityjs/core @purityjs/router @purityjs/platform @purityjs/ssr @purityjs/vite-plugin @purityjs/cli; do
            spec="$package@$RELEASE_VERSION"
            until npm view "$spec" version --prefer-online --fetch-retries=0 --fetch-timeout=10000 >/dev/null 2>&1; do
              if (( SECONDS >= deadline )); then
                echo "::error::$spec was not visible in the npm registry within 10 minutes" >&2
                exit 1
              fi
              echo "Waiting for $spec to become visible in the npm registry"
              sleep 10
            done
            echo "$spec is visible in the npm registry"
          done

      - name: Check published CLI projects
        run: npm run test:published-cli
        env:
          PURITY_SMOKE_VERSION: ${{ env.RELEASE_VERSION }}

      - name: Verify package origins and create GitHub Release
        run: node scripts/finalize-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
