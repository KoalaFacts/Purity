name: Solid v2 rc.18 comparator lock verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/solid-v2/app-fixture/**'
      - '.github/workflows/solid-v2-rc18-lock.yml'

permissions:
  contents: read

jobs:
  isolated-lock:
    name: Build and inventory pinned rc.18 counter fixture
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/sv2-001-rc18-isolated-app-lock' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check fixture format using locked Oxfmt
        run: |
          npm ci
          npx vp fmt --check benchmark/solid-v2/app-fixture
      - name: Reinstall isolated pinned dependency tree
        working-directory: benchmark/solid-v2/app-fixture
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify actual package integrities and client entries
        working-directory: benchmark/solid-v2/app-fixture
        env:
          NODE_ENV: production
          NODE_OPTIONS: ''
        run: node --experimental-strip-types verify-target-lock.ts
      - name: Build rc.18 counter app using isolated Vite 8
        working-directory: benchmark/solid-v2/app-fixture
        run: npm exec -- vite build
      - name: Inventory all emitted JS chunks at Brotli 11
        working-directory: benchmark/solid-v2/app-fixture
        run: node --experimental-strip-types inventory-chunks.ts
      - name: Verify source identity in both reports
        working-directory: benchmark/solid-v2/app-fixture
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { execFileSync } from "node:child_process";
            import { readFileSync } from "node:fs";
            const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            assert.equal(head, process.env.EXPECTED_SOURCE_SHA, "Checkout differs from PR head");
            for (const report of ["validation-report.json", "dist/payload-report.json"]) {
              assert.equal(JSON.parse(readFileSync(report, "utf8")).sourceRef, head, report);
            }
          '
      - name: Archive lock, verified package identity and full app chunks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solid-v2-rc18-lock-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark/solid-v2/app-fixture/package-lock.json
            benchmark/solid-v2/app-fixture/validation-report.json
            benchmark/solid-v2/app-fixture/dist/
          include-hidden-files: true
          if-no-files-found: error
