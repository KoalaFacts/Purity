name: Client-first AOT preflight

on:
  push:
    branches: [refactor/sv2-012-client-first-aot]
    paths:
      - .github/workflows/client-aot-preflight.yml
      - scripts/dev-client-aot.ts

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Finish real CLI migrations from a failing test
        run: |
          mkdir -p "$RUNNER_TEMP/aot-final"
          node scripts/dev-client-aot.ts
          git rm scripts/dev-client-aot.ts
          npm run format
          npm run format:check
          npm run lint
          (cd packages/core && npx tsc --noEmit)
      - name: All workspace tests
        run: |
          npm test > "$RUNNER_TEMP/aot-final/tests.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/aot-final/tests.log"; exit 1; }
          node --test scripts/finalize-release.test.mjs
          tail -n 30 "$RUNNER_TEMP/aot-final/tests.log"
      - name: Build and freeze clean candidate
        run: |
          npm run build -w @purityjs/core
          npm run build -w @purityjs/vite-plugin
          npm run build -w @purityjs/ssr
          npm run build -w @purityjs/cli
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add packages docs benchmark
          git diff --cached --binary > "$RUNNER_TEMP/aot-final/product.patch"
          git commit -m 'feat(compiler)!: finish SSR scaffold migration and remove preflight tools'
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > "$RUNNER_TEMP/aot-final/source-sha.txt"
      - name: Verify every complete application in three browser engines
        run: |
          npx playwright install --with-deps chromium firefox webkit > "$RUNNER_TEMP/aot-final/browser-install.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/aot-final/browser-install.log"; exit 1; }
          node benchmark/bundle-size/measure.ts --verify > "$RUNNER_TEMP/aot-final/size.log" 2>&1 || { cat "$RUNNER_TEMP/aot-final/size.log"; exit 1; }
          cp benchmark/dist/bundle-size/report.* "$RUNNER_TEMP/aot-final/"
          cat "$RUNNER_TEMP/aot-final/size.log"
      - name: Normal feature fast-forward only
        run: |
          test "$GITHUB_REF_NAME" = 'refactor/sv2-012-client-first-aot'
          current=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Save recoverable diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/aot-final"
          git diff --binary HEAD > "$RUNNER_TEMP/aot-final/uncommitted.patch"
          git status --short > "$RUNNER_TEMP/aot-final/status.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: client-first-aot-final-preflight
          path: ${{ runner.temp }}/aot-final/
          retention-days: 7
          if-no-files-found: error
