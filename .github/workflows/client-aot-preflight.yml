name: Client-first AOT preflight

on:
  push:
    branches: [refactor/sv2-012-client-first-aot]
    paths:
      - .github/workflows/client-aot-preflight.yml
      - scripts/dev-client-aot.ts
      - packages/vite-plugin/tests/client-first-aot.test.ts

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Build unchanged production baseline
        run: |
          npm run build -w @purityjs/core
          npm run build -w @purityjs/vite-plugin
          npm run build -w @purityjs/ssr
          node benchmark/bundle-size/measure.ts
          mkdir -p "$RUNNER_TEMP/aot-preflight"
          cp benchmark/dist/bundle-size/report.json "$RUNNER_TEMP/aot-preflight/baseline.json"
      - name: Verify intended red phase
        shell: bash
        run: |
          set +e
          npm run test -w @purityjs/vite-plugin -- tests/client-first-aot.test.ts > "$RUNNER_TEMP/aot-preflight/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/aot-preflight/red.log"
          test "$status" -ne 0
          grep -q 'default client output omits hydration walkers' "$RUNNER_TEMP/aot-preflight/red.log"
          git grep -n 'purity(' -- packages/vite-plugin/tests packages/cli benchmark examples > "$RUNNER_TEMP/aot-preflight/consumers.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: client-aot-preflight-evidence
          path: ${{ runner.temp }}/aot-preflight/
          retention-days: 7
          if-no-files-found: error
