name: Client-first AOT preflight

on:
  push:
    branches: [refactor/sv2-012-client-first-aot]
    paths:
      - .github/workflows/client-aot-preflight.yml
      - scripts/dev-client-aot.ts

permissions:
  contents: write

jobs:
  preflight:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat(compiler)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Build unchanged production baseline
        run: |
          mkdir -p "$RUNNER_TEMP/aot-preflight"
          npm run build -w @purityjs/core
          npm run build -w @purityjs/vite-plugin
          npm run build -w @purityjs/ssr
          node benchmark/bundle-size/measure.ts
          cp benchmark/dist/bundle-size/report.json "$RUNNER_TEMP/aot-preflight/baseline.json"
      - name: Apply implementation after recorded red phase
        run: |
          node scripts/dev-client-aot.ts
          git rm scripts/dev-client-aot.ts
          npm run format
          git restore -- .github/workflows
          git diff --stat
      - name: Verify client contracts and all workspace regressions
        run: |
          set -o pipefail
          npm run test -w @purityjs/vite-plugin -- tests/client-first-aot.test.ts 2>&1 | tee "$RUNNER_TEMP/aot-preflight/client-tests.log"
          npm run lint 2>&1 | tee "$RUNNER_TEMP/aot-preflight/lint.log"
          (cd packages/core && npx tsc --noEmit)
          npm test 2>&1 | tee "$RUNNER_TEMP/aot-preflight/workspaces.log"
          node --test scripts/finalize-release.test.mjs
      - name: Build candidate and freeze local source
        run: |
          npm run build -w @purityjs/core
          npm run build -w @purityjs/vite-plugin
          npm run build -w @purityjs/ssr
          npm run build -w @purityjs/cli
          npm run build -w benchmark
          npm run build -w examples/dashboard
          npm run build -w examples/docs-site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages benchmark docs scripts examples
          git diff --cached --binary > "$RUNNER_TEMP/aot-preflight/product.patch"
          git commit -m 'feat(compiler)!: land verified client-first AOT implementation and migrations' -m 'Default strict client-only factories; explicit hydratable builds retain SSR adoption. Preserve original inventories and add same-source client-only applications. Pinned Node24 preflight passed; formal exact-head browser/security/consumer CI and independent review remain required. Refs #276.'
          git rev-parse HEAD > "$RUNNER_TEMP/aot-preflight/candidate-sha.txt"
          git status --short
          test -z "$(git status --porcelain)"
          node benchmark/bundle-size/measure.ts
          cp benchmark/dist/bundle-size/report.json "$RUNNER_TEMP/aot-preflight/candidate.json"
      - name: Reject whole-app or chunk growth before push
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const dir = process.env.RUNNER_TEMP + '/aot-preflight/';
          const base = JSON.parse(readFileSync(dir + 'baseline.json', 'utf8'));
          const next = JSON.parse(readFileSync(dir + 'candidate.json', 'utf8'));
          for (const field of ['node', 'zlib', 'brotli', 'versions', 'settings', 'fixtureHashes']) assert.deepEqual(next[field], base[field], 'Changed comparison input: ' + field);
          assert.equal(next.dirty, false);
          assert.equal(next.schemaVersion, 5);
          assert.equal(next.packages.length, 14);
          assert.equal(next.measurements.length, 17);
          const metrics = ['rawBytes', 'gzipBytes', 'brotliBytes'];
          const rows = [];
          for (const kind of ['packages', 'measurements']) {
            const key = kind === 'packages' ? 'entry' : 'profile';
            for (const old of base[kind]) {
              const candidate = next[kind].find((r) => r[key] === old[key]);
              assert(candidate, 'Missing original ' + old[key]);
              for (const m of metrics) assert(candidate[m] <= old[m], `${old[key]} ${m} grew: ${old[m]} -> ${candidate[m]}`);
              if (old.chunks) {
                assert.deepEqual(candidate.chunks.map((c) => c.file), old.chunks.map((c) => c.file));
                for (let i = 0; i < old.chunks.length; i++) for (const m of metrics) assert(candidate.chunks[i][m] <= old.chunks[i][m], 'Original chunk grew: ' + old[key]);
              }
            }
          }
          for (const name of ['counter', 'counter-client', 'controls', 'form', 'resource']) {
            const old = next.measurements.find((r) => r.profile === name + '-aot');
            const client = next.measurements.find((r) => r.profile === name + '-csr-aot');
            assert.equal(client.compilation, 'client');
            assert.equal(old.compilation, 'hydrate');
            assert.equal(client.functionConstructorCalls, 0);
            for (const m of metrics) {
              assert(client[m] <= old[m], name + ' client-only payload grew');
              assert.equal(client.chunks.reduce((sum, c) => sum + c[m], 0), client[m]);
            }
            rows.push({ application: name, fullHydration: old, clientOnly: client });
          }
          assert.deepEqual(next.violations, []);
          writeFileSync(dir + 'mode-comparison.json', JSON.stringify({ note: 'Same-source build-mode comparison, not whole-core reduction or Solid parity', rows }, null, 2));
          console.log(JSON.stringify(rows.map((r) => ({ app: r.application, before: r.fullHydration.brotliBytes, after: r.clientOnly.brotliBytes, saved: r.fullHydration.brotliBytes - r.clientOnly.brotliBytes })), null, 2));
          NODE
      - name: Normal feature-branch fast-forward only
        run: |
          test "$GITHUB_REF_NAME" = 'refactor/sv2-012-client-first-aot'
          current=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Preserve actual patch and diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/aot-preflight"
          git diff --binary HEAD > "$RUNNER_TEMP/aot-preflight/uncommitted.patch"
          git status --short | tee "$RUNNER_TEMP/aot-preflight/status.txt"
          git grep -n 'purity(' -- packages/cli benchmark/tools examples > "$RUNNER_TEMP/aot-preflight/consumers.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: client-aot-preflight-evidence
          path: ${{ runner.temp }}/aot-preflight/
          retention-days: 7
          if-no-files-found: error
