name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version to publish (e.g. 0.1.0, 0.2.0)'
        required: true
        default: '0.3.0'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Verify requested version
        run: |
          for package_dir in . packages/core packages/ssr packages/vite-plugin packages/cli; do
            package_version="$(node -p "require('./${package_dir}/package.json').version")"
            if [ "$package_version" != "$RELEASE_VERSION" ]; then
              echo "Version mismatch in $package_dir: $package_version != $RELEASE_VERSION" >&2
              exit 1
            fi
          done

      # Full CI checks before publish
      - name: Format check (Oxfmt — Vite+)
        run: npm run format:check

      - name: Lint (Oxlint — Vite+)
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p packages/core

      - name: Test core
        run: npm test -w packages/core

      - name: Test SSR
        run: npm test -w packages/ssr

      - name: Test vite-plugin
        run: npm test -w packages/vite-plugin

      # Build in dependency order
      - name: Build core
        run: npm run build -w packages/core

      - name: Build SSR
        run: npm run build -w packages/ssr

      - name: Build vite-plugin
        run: npm run build -w packages/vite-plugin

      - name: Build cli
        run: npm run build -w packages/cli

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check packaged SSR node retention
        run: npm run test:browser:ssr-retention

      # Publish in dependency order
      # Each package trusts this workflow and the production environment on npm.
      - name: Publish core
        run: |
          if npm view "@purityjs/core@$RELEASE_VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "@purityjs/core@$RELEASE_VERSION is already published"
          else
            npm publish -w packages/core
          fi

      - name: Publish SSR
        run: |
          if npm view "@purityjs/ssr@$RELEASE_VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "@purityjs/ssr@$RELEASE_VERSION is already published"
          else
            npm publish -w packages/ssr
          fi

      - name: Publish vite-plugin
        run: |
          if npm view "@purityjs/vite-plugin@$RELEASE_VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "@purityjs/vite-plugin@$RELEASE_VERSION is already published"
          else
            npm publish -w packages/vite-plugin
          fi

      - name: Publish cli
        run: |
          if npm view "@purityjs/cli@$RELEASE_VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "@purityjs/cli@$RELEASE_VERSION is already published"
          else
            npm publish -w packages/cli
          fi

      - name: Wait for published packages in npm registry
        run: |
          deadline=$((SECONDS + 600))
          for package in @purityjs/core @purityjs/ssr @purityjs/vite-plugin @purityjs/cli; do
            spec="$package@$RELEASE_VERSION"
            until npm view "$spec" version --prefer-online --fetch-retries=0 --fetch-timeout=10000 >/dev/null 2>&1; do
              if (( SECONDS >= deadline )); then
                echo "::error::$spec was not visible in the npm registry within 10 minutes" >&2
                exit 1
              fi
              echo "Waiting for $spec to become visible in the npm registry"
              sleep 10
            done
            echo "$spec is visible in the npm registry"
          done

      - name: Check published CLI projects
        run: npm run test:published-cli
        env:
          PURITY_SMOKE_VERSION: ${{ env.RELEASE_VERSION }}

      # Tag the release
      - name: Create git tag
        run: |
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
